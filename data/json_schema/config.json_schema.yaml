$defs:
  window_size:
    type: array
    minItems: 2
    maxItems: 2
    items:
      oneOf:
        - type: string
          pattern: '^(100|([1-9][0-9])(?:[.][0-9]+)?)%$'
          description: 'Percentage of screen size: 10% to 100%'
        - type: integer
          minimum: 100
          description: 'Absolute pixels: minimum 100'
type: object
additionalProperties: false
properties:
  home_country:
    description: The name of the country as it is in photoshop:Country or Iptc4xmpCore:CountryName, not the ISO code. 
    example: Magyarország
    type: string
    default: ''
  geo_keyword_prefix:
    type: string
    default: ''
  regions:
    type: array
    items:
      type: string
      minLength: 1
      example: Duna
    default: []
  image_file:
    type: object
    additionalProperties: false
    properties:
      supported_suffixes:
        type: array
        items:
          type: string
        example:
          - .jpg
          - .jpeg
          - .png
          - .bmp
          - .gif
          - .tiff
        default:
          - .jpg
          - .jpeg
          - .png
          - .bmp
          - .gif
          - .tiff
  font:
    type: object
    additionalProperties: false
    properties:
      by_os:
        type: object
        additionalProperties: false
        patternProperties:
          ^(windows|macos|linux)$:
            type: object
            additionalProperties: false
            patternProperties:
              ^(main|monospace)$:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
                  example: 'C:\Windows\Fonts\Verdana.ttf'
        default:
          windows:
            main:
              - 'C:\Windows\Fonts\segoeui.ttf'
              - 'C:\Windows\Fonts\arial.ttf'
              - 'C:\Windows\Fonts\tahoma.ttf'
            monospace:
              - 'C:\Windows\Fonts\consola.ttf'
              - 'C:\Windows\Fonts\cour.ttf'
              - 'C:\Windows\Fonts\lucon.ttf'
          macos:
            main:
              - /Library/Fonts/Arial.ttf
              - /System/Library/Fonts/Supplemental/Arial.ttf
            monospace:
              - /Library/Fonts/Courier New.ttf
              - /System/Library/Fonts/Monaco.dfont
              - /System/Library/Fonts/Menlo.ttc
          linux:
            main:
              - /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
              - /usr/share/fonts/TTF/DejaVuSans.ttf
            monospace:
              - /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
              - /usr/share/fonts/TTF/DejaVuSansMono.ttf
              - /usr/share/fonts/truetype/liberation/LiberationMono-Regular.ttf
      candidates:
        type: array
        items:
          type: string
          description: Font path
          example: 'C:\Windows\Fonts\Verdana.ttf'
        default: []
      size:
        oneOf:
          - type: string
            pattern: '^(100|[1-9][0-9]?)%$'
            description: 'Percentage of window width: 1% to 100%'
          - type: integer
            minimum: 10
            description: 'Absolute pixels: minimum 10'
        default: 0.625%
  single_instance_mode:
    type: boolean
    default: true
  path_classifications:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        pattern:
          type: string
          pattern: '[(].+[)]'
          example: '(/(\d{4})/(\d{2})/(\d{2})(?:/|$))'
        names:
          type: array
          items:
            type: string
            pattern: \\S
          minItems: 1
          example:
            - year
            - month
            - day
    default: []
  watched_folders:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      properties:
        folder:
          type: string
          pattern: '^[a-zA-Z]:\\.+$'
          example: 'F:\photos'
        auto_scan:
          type: boolean
          default: false
        example: {'folder': 'F:\photos', 'auto_scan': true}
    example: [{'folder': 'F:\photos', 'auto_scan': true}, {'folder': 'C:\photos', 'auto_scan': false}]
    default: []
  window_mode:
    type: object
    additionalProperties: false
    properties:
      is_default:
        type: boolean
        default: false
      default_size:
        $ref: '#/$defs/window_size'
        default:
          - 80%
          - 80%
  quiet_mode:
    type: boolean
    default: false
    log:
        type: object
        additionalProperties: false
        properties:
            retention_days:
                type: integer
                default: 3
        default: {}
  filters:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        expression:
          type: string
          pattern: '^[a-zA-Z0-9_]+(:[a-zA-Z0-9_]+)? % ''.+''$'
          example: Keywords % 'NOMINUS'
        key:
          type: string
          pattern: '^[a-z0-9]$'
          example: 'n'
    default: []
  map:
    type: object
    additionalProperties: false
    properties:
      cache:
        type: object
        additionalProperties: false
        properties:
          location:
            type: string
            description: >-
              Optional path to cache directory. If missing or empty, a default
              location will be used.
            example: 'C:\map_cache'
            default: ''
          enabled:
            type: boolean
            default: true
          max_size_mb:
            type: integer
            minimum: 0
            maximum: 100000
            default: 5000
      viewer:
        type: object
        additionalProperties: false
        properties:
          zoom:
            type: object
            additionalProperties: false
            properties:
              default:
                type: integer
                default: 15
              minimum:
                type: integer
                default: 2
              maximum:
                type: integer
                default: 18
          window:
            type: object
            properties:
              inline:
                type: boolean
                default: true
              size:
                $ref: '#/$defs/window_size'
                default:
                  - 25%
                  - 18.75%
      links:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              example: OpenStreetMap
            enabled:
              type: boolean
              default: true
            zoom:
              type: integer
              minimum: 10
              maximum: 50
              default: 15
            gui_url_template:
              type: string
              pattern: '^http(s)?://.+\{\{\s*GPSLatitude\s*\}\}.+\{\{\s*GPSLongitude\s*\}\}'
              example: >-
                https://www.openstreetmap.org/?mlat={{GPSLatitude}}&mlon={{GPSLongitude}}#map={{zoom}}/{{GPSLatitude}}/{{GPSLongitude}}
        default: []
